name: Build Mero Kharcho Project and APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Generate Complete Android Project Structure
        run: |
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/java/com/merokharcho/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/assets/www

          # 1. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MeroKharcho"
          include(":app")
          EOF

          # 2. build.gradle.kts (root)
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 4. gradle-wrapper.properties
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # 5. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.merokharcho.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.merokharcho.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
                  debug {
                      isDebuggable = true
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.webkit:webkit:1.10.0")
          }
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MeroKharcho">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/merokharcho/app/MainActivity.kt
          package com.merokharcho.app

          import android.annotation.SuppressLint
          import android.os.Bundle
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this).apply {
                      settings.apply {
                          javaScriptEnabled = true
                          domStorageEnabled = true
                          databaseEnabled = true
                          allowFileAccess = true
                          allowContentAccess = true
                          cacheMode = WebSettings.LOAD_DEFAULT
                          useWideViewPort = true
                          loadWithOverviewMode = true
                          displayZoomControls = false
                          builtInZoomControls = false
                      }
                      webViewClient = object : WebViewClient() {}
                      webChromeClient = WebChromeClient()
                  }
                  setContentView(webView)
                  webView.loadUrl("file:///android_asset/www/index.html")

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (webView.canGoBack()) {
                              webView.goBack()
                          } else {
                              finish()
                          }
                      }
                  })
              }
          }
          EOF

          # 8. Resources
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Mero Kharcho</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="navy_primary">#0B1325</color>
              <color name="gold_accent">#D4AF37</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.MeroKharcho" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/navy_primary</item>
                  <item name="colorPrimaryVariant">#060B17</item>
                  <item name="colorOnPrimary">@color/white</item>
                  <item name="android:statusBarColor">@color/navy_primary</item>
                  <item name="android:windowBackground">@color/navy_primary</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0B1325" android:pathData="M54,12 A42,42 0 1,0 54,96 A42,42 0 1,0 54,12 Z" />
              <path android:fillColor="#D4AF37" android:pathData="M24,38 L84,38 L84,74 C84,77.3 81.3,80 78,80 L30,80 C26.7,80 24,77.3 24,74 Z" />
              <path android:fillColor="#152238" android:pathData="M24,38 C24,34 27,31 31,31 L77,31 C81,31 84,34 84,38 L84,48 L24,48 Z" />
              <path android:fillColor="#10B981" android:pathData="M32,66 L44,54 L54,62 L74,40 L64,40 L74,40 L74,50" />
              <path android:fillColor="#FBBF24" android:pathData="M66,54 A10,10 0 1,0 66,74 A10,10 0 1,0 66,54 Z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/navy_primary" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          # 9. Assets
          cat << 'EOF' > app/src/main/assets/www/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>Mero Kharcho</title>
            <link rel="stylesheet" href="style.css">
          </head>
          <body data-theme="dark">
            <div id="app">
              <header class="app-header">
                <div class="header-brand">
                  <div class="logo-box">₹</div>
                  <div>
                    <h1 class="brand-title">Mero Kharcho</h1>
                    <p class="brand-sub">Mero Paiso, Mero Hisaab</p>
                  </div>
                </div>
                <button id="theme-toggle-btn" class="icon-btn">🌓</button>
              </header>

              <main class="main-content">
                <section id="view-dashboard" class="app-view active">
                  <div class="card net-card">
                    <div class="card-caption">Total Net Balance</div>
                    <div class="net-amount" id="dash-net-balance">₹0</div>
                    <div class="card-pills-row">
                      <div class="stat-pill inc"><span>Income</span><strong id="dash-total-income">₹0</strong></div>
                      <div class="stat-pill exp"><span>Expenses</span><strong id="dash-total-expense">₹0</strong></div>
                    </div>
                  </div>

                  <div class="grid-2">
                    <div class="mini-card"><span class="label">Today's Expense</span><strong id="dash-today-expense" class="val text-danger">₹0</strong></div>
                    <div class="mini-card"><span class="label">This Month</span><strong id="dash-month-expense" class="val text-danger">₹0</strong></div>
                  </div>

                  <div class="card budget-card">
                    <div class="flex-between"><span>Monthly Budget Status</span><span id="budget-percent-val">0%</span></div>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" id="budget-progress-bar" style="width: 0%;"></div></div>
                    <div class="flex-between budget-details">
                      <span id="budget-spent-txt">Spent: ₹0</span>
                      <span id="budget-remaining-txt">Limit: ₹0</span>
                    </div>
                  </div>

                  <div class="action-buttons-grid">
                    <button class="btn btn-green" onclick="App.openModal('income')">+ Income</button>
                    <button class="btn btn-red" onclick="App.openModal('expense')">− Expense</button>
                    <button class="btn btn-navy" onclick="App.openModal('transfer')">⇄ Transfer</button>
                  </div>

                  <div class="section-title-row">
                    <h3>Recent Transactions</h3>
                    <a href="javascript:void(0)" onclick="App.switchTab('transactions')">View All</a>
                  </div>
                  <div id="dash-recent-list" class="tx-list"></div>
                </section>

                <section id="view-transactions" class="app-view">
                  <div class="card">
                    <input type="text" id="tx-search-input" placeholder="Search title or category..." oninput="App.applyTxFilters()">
                    <div class="filters-row" style="display:flex; gap:8px; margin-top:8px;">
                      <select id="tx-filter-type" onchange="App.applyTxFilters()">
                        <option value="ALL">All Types</option>
                        <option value="INCOME">Income</option>
                        <option value="EXPENSE">Expense</option>
                        <option value="TRANSFER">Transfers</option>
                      </select>
                    </div>
                  </div>
                  <div id="full-tx-list" class="tx-list"></div>
                </section>

                <section id="view-reports" class="app-view">
                  <div class="card">
                    <div class="flex-between">
                      <h3>Yearly Cashflow</h3>
                      <select id="report-year-select" onchange="App.renderReports()"></select>
                    </div>
                    <div class="grid-3 summary-grid" style="margin-top:12px;">
                      <div class="mini-card"><span>Income</span><strong id="report-year-income" class="text-success">₹0</strong></div>
                      <div class="mini-card"><span>Expense</span><strong id="report-year-expense" class="text-danger">₹0</strong></div>
                      <div class="mini-card"><span>Net</span><strong id="report-year-net" class="text-gold">₹0</strong></div>
                    </div>
                  </div>
                  <div class="card">
                    <h3>Category Spending</h3>
                    <div id="category-report-list" style="margin-top:8px;"></div>
                  </div>
                  <div class="card">
                    <h3>12 Months Breakdown</h3>
                    <table class="report-table" style="width:100%; border-collapse:collapse; margin-top:8px;">
                      <thead><tr><th>Month</th><th>Income</th><th>Expense</th><th>Net</th></tr></thead>
                      <tbody id="monthly-report-body"></tbody>
                    </table>
                  </div>
                </section>

                <section id="view-budgets" class="app-view">
                  <div class="card">
                    <h3>Set Monthly Spending Limit</h3>
                    <p style="font-size:0.8rem; color:var(--text-muted); margin: 6px 0 12px;">Get warnings when expenses approach this limit.</p>
                    <div style="display:flex; gap:8px;">
                      <input type="number" id="budget-input" placeholder="e.g. 25000">
                      <button class="btn btn-gold" onclick="App.saveBudgetLimit()">Save</button>
                    </div>
                  </div>
                </section>

                <section id="view-settings" class="app-view">
                  <div class="card">
                    <h3>Private Local Backup</h3>
                    <p style="font-size:0.8rem; color:var(--text-muted); margin: 6px 0 12px;">All financial records stay on this device. Back up to keep them safe.</p>
                    <button class="btn btn-navy" style="width:100%; margin-bottom:8px;" onclick="App.exportBackupJSON()">Download JSON Backup</button>
                    <button class="btn btn-navy" style="width:100%; margin-bottom:8px;" onclick="App.exportTransactionsCSV()">Export to Excel/CSV</button>
                    <label class="btn btn-navy" style="display:block; text-align:center; cursor:pointer;">
                      Restore Backup JSON
                      <input type="file" id="restore-file-input" style="display:none;" accept=".json" onchange="App.importBackupJSON(event)">
                    </label>
                    <button class="btn" style="background:#DC2626; width:100%; margin-top:14px;" onclick="App.clearAllData()">Reset All App Data</button>
                  </div>
                </section>
              </main>

              <nav class="bottom-nav">
                <button class="nav-item active" onclick="App.switchTab('dashboard')"><span>📊</span><small>Home</small></button>
                <button class="nav-item" onclick="App.switchTab('transactions')"><span>📝</span><small>Records</small></button>
                <button class="nav-item" onclick="App.switchTab('reports')"><span>📈</span><small>Reports</small></button>
                <button class="nav-item" onclick="App.switchTab('budgets')"><span>🎯</span><small>Budget</small></button>
                <button class="nav-item" onclick="App.switchTab('settings')"><span>⚙️</span><small>Settings</small></button>
              </nav>

              <div id="tx-modal" class="modal-overlay">
                <div class="modal-card">
                  <h3 id="modal-title" style="margin-bottom:12px;">Record</h3>
                  <form id="tx-form" onsubmit="App.handleFormSubmit(event)">
                    <input type="hidden" id="entry-type" value="EXPENSE">
                    <div class="form-group"><label>Amount (₹)</label><input type="number" id="entry-amount" step="any" required></div>
                    <div class="form-group" id="form-title-group"><label>Title</label><input type="text" id="entry-title" required placeholder="e.g. Rashan, Petrol"></div>
                    <div class="form-group" id="form-cat-group"><label>Category</label><select id="entry-category"></select></div>
                    <div class="form-group" id="form-dest-account-group" style="display:none;"><label>Transfer To</label><select id="entry-dest-account"><option value="Bank">Bank</option><option value="Cash">Cash</option><option value="UPI">UPI</option></select></div>
                    <div class="form-group"><label>Account</label><select id="entry-account"><option value="Cash">Cash</option><option value="Bank">Bank</option><option value="UPI">UPI</option></select></div>
                    <div class="form-group"><label>Date</label><input type="date" id="entry-date" required></div>
                    <div style="display:flex; gap:8px; margin-top:14px;">
                      <button type="button" class="btn" style="background:#334155; flex:1;" onclick="App.closeModal()">Cancel</button>
                      <button type="submit" class="btn btn-gold" style="flex:1;">Save</button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
            <script src="app.js"></script>
          </body>
          </html>
          EOF

          cat << 'EOF' > app/src/main/assets/www/style.css
          :root {
            --bg-primary: #070D19;
            --bg-card: #0F1B30;
            --bg-card-subtle: #172642;
            --gold: #D4AF37;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --green: #10B981;
            --red: #EF4444;
            --border: #1E293B;
          }
          [data-theme="light"] {
            --bg-primary: #F1F5F9;
            --bg-card: #FFFFFF;
            --bg-card-subtle: #F8FAFC;
            --gold: #B45309;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --green: #059669;
            --red: #DC2626;
            --border: #E2E8F0;
          }
          * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
          body { background: var(--bg-primary); color: var(--text-main); min-height: 100vh; padding-bottom: 70px; }
          .app-header { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: var(--bg-card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
          .header-brand { display: flex; align-items: center; gap: 10px; }
          .logo-box { width: 38px; height: 38px; border-radius: 8px; background: var(--gold); color: #000; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
          .brand-title { font-size: 1.1rem; color: var(--gold); }
          .brand-sub { font-size: 0.7rem; color: var(--text-muted); }
          .icon-btn { background: var(--bg-card-subtle); border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; cursor: pointer; color: var(--text-main); }
          .main-content { padding: 14px; }
          .app-view { display: none; }
          .app-view.active { display: block; }
          .card { background: var(--bg-card); border-radius: 12px; padding: 14px; border: 1px solid var(--border); margin-bottom: 12px; }
          .net-card { text-align: center; border: 1px solid rgba(212, 175, 55, 0.3); }
          .card-caption { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
          .net-amount { font-size: 2rem; font-weight: 800; margin: 6px 0 12px; }
          .card-pills-row { display: flex; gap: 8px; }
          .stat-pill { flex: 1; padding: 8px; border-radius: 8px; background: var(--bg-card-subtle); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; }
          .stat-pill span { font-size: 0.7rem; color: var(--text-muted); }
          .stat-pill.inc strong { color: var(--green); }
          .stat-pill.exp strong { color: var(--red); }
          .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
          .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
          .mini-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
          .mini-card span { font-size: 0.7rem; color: var(--text-muted); display: block; margin-bottom: 4px; }
          .flex-between { display: flex; justify-content: space-between; align-items: center; }
          .progress-bar-bg { background: var(--bg-card-subtle); border-radius: 6px; height: 8px; width: 100%; margin: 8px 0; overflow: hidden; }
          .progress-bar-fill { background: var(--gold); height: 100%; transition: width 0.3s; }
          .action-buttons-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
          .btn { border: none; border-radius: 8px; padding: 10px; font-weight: bold; cursor: pointer; color: #FFF; font-size: 0.85rem; }
          .btn-green { background: var(--green); }
          .btn-red { background: var(--red); }
          .btn-navy { background: #1E293B; border: 1px solid var(--border); }
          .btn-gold { background: var(--gold); color: #000; }
          .section-title-row { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 8px; }
          .section-title-row a { color: var(--gold); font-size: 0.8rem; text-decoration: none; }
          .tx-list { display: flex; flex-direction: column; gap: 8px; }
          .tx-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 10px; border-radius: 10px; border: 1px solid var(--border); }
          .tx-title { font-weight: 600; font-size: 0.9rem; }
          .tx-meta { font-size: 0.72rem; color: var(--text-muted); }
          .tx-amount { font-weight: bold; }
          .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; }
          .nav-item { background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; font-size: 0.65rem; }
          .nav-item.active { color: var(--gold); font-weight: bold; }
          .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: flex-end; justify-content: center; }
          .modal-overlay.open { display: flex; }
          .modal-card { background: var(--bg-card); width: 100%; max-width: 500px; border-radius: 16px 16px 0 0; padding: 16px; border-top: 2px solid var(--gold); }
          .form-group { margin-bottom: 10px; }
          .form-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px; }
          input, select { width: 100%; padding: 10px; border-radius: 6px; background: var(--bg-card-subtle); border: 1px solid var(--border); color: var(--text-main); font-size: 0.9rem; }
          .text-success { color: var(--green); }
          .text-danger { color: var(--red); }
          .text-gold { color: var(--gold); }
          EOF

          cat << 'EOF' > app/src/main/assets/www/app.js
          const App = {
            data: { transactions: [], monthlyBudget: 25000, theme: 'dark' },
            categories: {
              INCOME: ["Salary", "Business", "Overtime", "Freelance", "Rental", "Gifts", "Other Income"],
              EXPENSE: ["Rashan & Groceries", "Vegetables & Fruits", "Milk & Dairy", "Household Supplies", "Electricity Bills", "Gas Cylinder", "Mobile Recharge", "Internet Bills", "Medicines & Healthcare", "Travel & Petrol", "Clothes & Shopping", "Education", "Loans & EMIs", "Eating Out", "Other Expenses"]
            },
            init() {
              this.loadState();
              this.renderDashboard();
              document.getElementById('theme-toggle-btn').onclick = () => {
                const cur = document.body.getAttribute('data-theme');
                const next = cur === 'dark' ? 'light' : 'dark';
                document.body.setAttribute('data-theme', next);
                this.data.theme = next;
                this.persist();
              };
            },
            loadState() {
              try {
                const s = localStorage.getItem('MK_STORE');
                if (s) this.data = JSON.parse(s);
              } catch(e){}
            },
            persist() { localStorage.setItem('MK_STORE', JSON.stringify(this.data)); },
            formatINR(val) { return "₹" + Number(val || 0).toLocaleString('en-IN'); },
            switchTab(t) {
              document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
              document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
              const v = document.getElementById('view-' + t);
              if (v) v.classList.add('active');
              if (t === 'dashboard') this.renderDashboard();
              if (t === 'transactions') this.renderTransactions();
              if (t === 'reports') this.renderReports();
              if (t === 'budgets') document.getElementById('budget-input').value = this.data.monthlyBudget || 25000;
            },
            openModal(type) {
              const m = document.getElementById('tx-modal');
              document.getElementById('tx-form').reset();
              document.getElementById('entry-date').valueAsDate = new Date();
              document.getElementById('entry-type').value = type.toUpperCase();
              const isTrans = type === 'transfer';
              document.getElementById('form-cat-group').style.display = isTrans ? 'none' : 'block';
              document.getElementById('form-dest-account-group').style.display = isTrans ? 'block' : 'none';
              document.getElementById('modal-title').innerText = isTrans ? "Transfer Money" : (type === 'income' ? "Add Income" : "Add Expense");
              if (!isTrans) {
                const cats = type === 'income' ? this.categories.INCOME : this.categories.EXPENSE;
                document.getElementById('entry-category').innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
              }
              m.classList.add('open');
            },
            closeModal() { document.getElementById('tx-modal').classList.remove('open'); },
            handleFormSubmit(e) {
              e.preventDefault();
              const type = document.getElementById('entry-type').value;
              const amount = parseFloat(document.getElementById('entry-amount').value);
              const date = document.getElementById('entry-date').value;
              const title = document.getElementById('entry-title').value;
              const account = document.getElementById('entry-account').value;
              const category = type === 'TRANSFER' ? 'Transfer to ' + document.getElementById('entry-dest-account').value : document.getElementById('entry-category').value;
              this.data.transactions.unshift({ id: 'tx_' + Date.now(), type, amount, date, title, account, category });
              this.persist();
              this.closeModal();
              this.renderDashboard();
            },
            deleteTx(id) {
              if (confirm("Delete this entry?")) {
                this.data.transactions = this.data.transactions.filter(t => t.id !== id);
                this.persist();
                this.renderDashboard();
                this.renderTransactions();
              }
            },
            renderDashboard() {
              let inc = 0, exp = 0, todayExp = 0, monthExp = 0;
              const today = new Date().toISOString().split('T')[0];
              const curMonth = today.substring(0, 7);
              this.data.transactions.forEach(t => {
                if (t.type === 'INCOME') inc += t.amount;
                if (t.type === 'EXPENSE') {
                  exp += t.amount;
                  if (t.date === today) todayExp += t.amount;
                  if (t.date.startsWith(curMonth)) monthExp += t.amount;
                }
              });
              document.getElementById('dash-net-balance').innerText = this.formatINR(inc - exp);
              document.getElementById('dash-total-income').innerText = this.formatINR(inc);
              document.getElementById('dash-total-expense').innerText = this.formatINR(exp);
              document.getElementById('dash-today-expense').innerText = this.formatINR(todayExp);
              document.getElementById('dash-month-expense').innerText = this.formatINR(monthExp);
              const b = this.data.monthlyBudget || 25000;
              const pct = Math.min(Math.round((monthExp / b) * 100), 100);
              document.getElementById('budget-percent-val').innerText = pct + '%';
              const bar = document.getElementById('budget-progress-bar');
              bar.style.width = pct + '%';
              bar.style.backgroundColor = pct >= 90 ? 'var(--red)' : 'var(--gold)';
              document.getElementById('budget-spent-txt').innerText = "Spent: " + this.formatINR(monthExp);
              document.getElementById('budget-remaining-txt').innerText = "Limit: " + this.formatINR(b);
              const recent = this.data.transactions.slice(0, 5);
              document.getElementById('dash-recent-list').innerHTML = recent.length ? recent.map(t => this.txHTML(t)).join('') : '<p style="text-align:center;color:var(--text-muted);padding:10px;">No entries yet.</p>';
            },
            txHTML(t) {
              const isInc = t.type === 'INCOME';
              const isExp = t.type === 'EXPENSE';
              const col = isInc ? 'text-success' : isExp ? 'text-danger' : 'text-gold';
              const sign = isInc ? '+' : isExp ? '−' : '⇄';
              return `<div class="tx-item">
                <div><div class="tx-title">${t.title}</div><div class="tx-meta">${t.date} • ${t.category} (${t.account})</div></div>
                <div style="display:flex;align-items:center;gap:8px;">
                  <span class="tx-amount ${col}">${sign} ${this.formatINR(t.amount)}</span>
                  <button onclick="App.deleteTx('${t.id}')" style="background:none;border:none;color:var(--text-muted);cursor:pointer;">✕</button>
                </div>
              </div>`;
            },
            renderTransactions() {
              const q = (document.getElementById('tx-search-input')?.value || '').toLowerCase();
              const type = document.getElementById('tx-filter-type')?.value || 'ALL';
              const list = this.data.transactions.filter(t => (type === 'ALL' || t.type === type) && (t.title.toLowerCase().includes(q) || t.category.toLowerCase().includes(q)));
              document.getElementById('full-tx-list').innerHTML = list.length ? list.map(t => this.txHTML(t)).join('') : '<p style="text-align:center;color:var(--text-muted);padding:14px;">No records found.</p>';
            },
            applyTxFilters() { this.renderTransactions(); },
            renderReports() {
              const sel = document.getElementById('report-year-select');
              const y = new Date().getFullYear();
              if (!sel.children.length) sel.innerHTML = `<option value="${y}">${y}</option><option value="${y-1}">${y-1}</option>`;
              const selYear = sel.value;
              let yInc = 0, yExp = 0;
              const catExp = {};
              const months = Array(12).fill(0).map(() => ({ inc: 0, exp: 0 }));
              this.data.transactions.forEach(t => {
                if (t.date.startsWith(selYear)) {
                  const m = parseInt(t.date.substring(5, 7)) - 1;
                  if (t.type === 'INCOME') { yInc += t.amount; months[m].inc += t.amount; }
                  if (t.type === 'EXPENSE') { yExp += t.amount; months[m].exp += t.amount; catExp[t.category] = (catExp[t.category] || 0) + t.amount; }
                }
              });
              document.getElementById('report-year-income').innerText = this.formatINR(yInc);
              document.getElementById('report-year-expense').innerText = this.formatINR(yExp);
              document.getElementById('report-year-net').innerText = this.formatINR(yInc - yExp);
              document.getElementById('category-report-list').innerHTML = Object.entries(catExp).map(([cat, amt]) => `
                <div style="margin-bottom:6px;">
                  <div class="flex-between" style="font-size:0.75rem;"><span>${cat}</span><strong>${this.formatINR(amt)}</strong></div>
                  <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${Math.min((amt/yExp)*100, 100)}%;"></div></div>
                </div>
              `).join('') || '<p style="font-size:0.8rem;color:var(--text-muted);">No expenses recorded.</p>';
              const mNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
              document.getElementById('monthly-report-body').innerHTML = months.map((m, i) => `
                <tr style="border-bottom:1px solid var(--border);font-size:0.75rem;">
                  <td style="padding:6px 0;">${mNames[i]}</td>
                  <td class="text-success">${this.formatINR(m.inc)}</td>
                  <td class="text-danger">${this.formatINR(m.exp)}</td>
                  <td><strong>${this.formatINR(m.inc - m.exp)}</strong></td>
                </tr>
              `).join('');
            },
            saveBudgetLimit() {
              const val = parseFloat(document.getElementById('budget-input').value);
              if (!isNaN(val) && val > 0) {
                this.data.monthlyBudget = val;
                this.persist();
                alert("Budget limit updated!");
                this.renderDashboard();
              }
            },
            exportBackupJSON() {
              const str = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.data));
              const a = document.createElement('a');
              a.href = str;
              a.download = "mero_kharcho_backup.json";
              a.click();
            },
            exportTransactionsCSV() {
              let c = "Type,Date,Title,Category,Amount,Account\n";
              this.data.transactions.forEach(t => { c += `"${t.type}","${t.date}","${t.title}","${t.category}",${t.amount},"${t.account}"\n`; });
              const a = document.createElement('a');
              a.href = URL.createObjectURL(new Blob([c], { type: 'text/csv' }));
              a.download = "mero_kharcho_records.csv";
              a.click();
            },
            importBackupJSON(e) {
              const f = e.target.files[0];
              if (!f) return;
              const r = new FileReader();
              r.onload = ev => {
                try {
                  const d = JSON.parse(ev.target.result);
                  if (d.transactions) { this.data = d; this.persist(); this.init(); alert("Data restored!"); }
                } catch(err) { alert("Invalid backup file"); }
              };
              r.readAsText(f);
            },
            clearAllData() {
              if (confirm("Reset and clear all saved entries?")) {
                this.data = { transactions: [], monthlyBudget: 25000, theme: 'dark' };
                this.persist();
                this.init();
              }
            }
          };
          window.addEventListener('DOMContentLoaded', () => App.init());
          EOF

      - name: Package Complete Project ZIP
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          zip -r MeroKharcho.zip app gradle build.gradle.kts settings.gradle.kts gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Build APK
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Complete Source Project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MeroKharcho-Project-Source
          path: MeroKharcho.zip
          retention-days: 14

      - name: Upload Installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MeroKharcho-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
